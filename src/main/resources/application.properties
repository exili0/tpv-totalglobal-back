spring.application.name=TPV_TotalGlobal

# Si no se indica perfil explícito, usamos local para desarrollo.
# En despliegue se debe fijar SPRING_PROFILES_ACTIVE con el perfil de entorno.
spring.profiles.default=local

# Configuración base NEUTRA para entorno/deploy.
# Para desarrollo local usa el perfil local (application-local.properties).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT para entorno/deploy (obligatorio definir JWT_SECRET en variables de entorno).
app.jwt.secret=${JWT_SECRET:}

# Validez del token en milisegundos (8h por defecto).
# Ajustable por variable JWT_EXPIRATION_MS.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}